name: Paper V isolated revision build

on:
  push:
    branches: [paper-v/audit-followup-2026-10-05]
    paths: [.github/workflows/paper-v-revision.yml]

permissions:
  contents: write

jobs:
  revision:
    if: github.ref == 'refs/heads/paper-v/audit-followup-2026-10-05'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install build and independent renderer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils python3-venv
          python3 -m venv .build/revision-venv
          .build/revision-venv/bin/pip install sympy==1.14.0 PyMuPDF==1.26.7
      - name: Apply audited source and validate complete suite
        run: |
          export PATH="$PWD/.build/revision-venv/bin:$PATH"
          python3 scripts/_paper_v_revision_patch.py
          python3 scripts/_paper_v_revision_delivery.py
      - name: Preserve validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paper-v-revision-verification
          path: |
            .build/paper-v-revision-validation/
            .build/paper-v-exact-checks.json
            .build/polynomial-flag-exponential-periods/*.pdf
            .build/polynomial-flag-exponential-periods/*.log
            notes/provenance/paper-v-audit-followup-build-2026-10-05.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
