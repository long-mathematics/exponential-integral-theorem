name: Paper IV comparison revision
on:
  push:
    branches: [docs/paper-iv-comparison-citations-20261005]
    paths: [.revision/apply.py]
permissions:
  contents: write
jobs:
  revise:
    if: github.ref == 'refs/heads/docs/paper-iv-comparison-citations-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Install repository build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Apply audited clarification
        run: python3 .revision/apply.py
      - name: Test and compile
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/iv-comparison-tests.log
          make pdf 2>&1 | tee /tmp/iv-comparison-build.log
      - name: Preserve the eight unaffected snapshots
        run: |
          python3 - <<'PY'
          import json, subprocess, hashlib
          from pathlib import Path
          target='papers/04-relative-exponential-nori-ayoub/relative-exponential-nori-ayoub.tex'
          assert hashlib.sha256(Path(target).read_bytes()).hexdigest()=='82bca80220ecf54a5f10f90951430cf6d14ae4df386a39a946985f719797ea55'
          path=Path('output/pdf/manifest.json')
          built=json.loads(path.read_text())
          baseline=json.loads(subprocess.check_output(['git','show','HEAD:output/pdf/manifest.json']))
          record=next(r for r in built['documents'] if r['source']==target)
          for r in baseline['documents']:
              if r['source']==target:
                  r.update(record)
              else:
                  assert Path(r['source']).read_bytes()==subprocess.check_output(['git','show','HEAD:'+r['source']])
                  Path(r['pdf']).write_bytes(subprocess.check_output(['git','show','HEAD:'+r['pdf']]))
          path.write_text(json.dumps(baseline,indent=2)+'\n')
          PY
      - name: Verify all nine snapshots
        run: |
          set -o pipefail
          make check 2>&1 | tee /tmp/iv-comparison-check.log
      - name: Record validation and commit the revision
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          target='papers/04-relative-exponential-nori-ayoub/relative-exponential-nori-ayoub.tex'
          manifest=json.loads(Path('output/pdf/manifest.json').read_text())
          record=next(r for r in manifest['documents'] if r['source']==target)
          unchanged=[]
          for r in manifest['documents']:
              if r['source']==target: continue
              assert Path(r['source']).read_bytes()==subprocess.check_output(['git','show','HEAD:'+r['source']])
              assert Path(r['pdf']).read_bytes()==subprocess.check_output(['git','show','HEAD:'+r['pdf']])
              unchanged.append(r)
          count=int(re.search(r'Ran (\d+) tests',Path('/tmp/iv-comparison-tests.log').read_text()).group(1))
          data={'date':'2026-10-05','baseline_main':'fa53b5fdb51834fe7135d3948ed4a35cd454c68e','revision_input_commit':os.environ['GITHUB_SHA'],'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'environment':'GitHub Actions ubuntu-24.04','commands':{'make test':f'passed: {count} tests','make pdf':'passed: 9 documents','make check':'passed: 9 documents and README links'},'canonical':record,'preserved_other_documents':unchanged,'source_assertions':['all theorem-like statements unchanged','all labels unchanged','body from affine-line quotient to bibliography byte-identical','author/title/date lines unchanged'],'local_validation':{'make test':'11 tests passed','make pdf':'all nine documents compiled','make check':'eight passed; preserved structural companion differs only under the previously recorded local toolchain; official check above passes'},'mathematical_scope':'Focused AI-assisted comparison/source audit, not a new whole-paper audit or independent specialist review','visual_review':'Recorded in the pull request after inspecting the official artifact','temporary_helpers':'Removed before final PR merge'}
          Path('notes/provenance/paper-iv-comparison-citation-build-2026-10-05.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git diff --check
          git add notes/repository-status.md notes/repairs/paper-iv-repair-ledger.md notes/provenance/paper-iv-comparison-citation-audit-2026-10-05.md notes/provenance/paper-iv-comparison-citation-build-2026-10-05.json papers/04-relative-exponential-nori-ayoub/relative-exponential-nori-ayoub.tex output/pdf/relative-exponential-nori-ayoub.pdf output/pdf/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Paper IV: clarify absolute period comparison and cite rational fiber theorems'
          git push origin HEAD:docs/paper-iv-comparison-citations-20261005
          git archive --format=tar.gz -o /tmp/paper-iv-comparison-revised.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: paper-iv-comparison-revised
          path: |
            /tmp/paper-iv-comparison-revised.tar.gz
            /tmp/iv-comparison-tests.log
            /tmp/iv-comparison-build.log
            /tmp/iv-comparison-check.log
            .build/relative-exponential-nori-ayoub/*.pdf
            .build/relative-exponential-nori-ayoub/*.log
          include-hidden-files: true
          retention-days: 7
