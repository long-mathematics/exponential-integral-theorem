name: Paper IV repair workspace

on:
  push:
    branches: [paper-iv/lissity-repair-2026-10-05]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Export exact tracked workspace
        run: git archive --format=tar HEAD -o /tmp/eit-workspace.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paper-iv-repair-workspace
          path: /tmp/eit-workspace.tar
          retention-days: 3
          if-no-files-found: error
