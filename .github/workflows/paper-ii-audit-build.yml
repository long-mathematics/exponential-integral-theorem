name: Paper II audit revision build

on:
  push:
    branches: [paper-ii/audit-clarifications-2026-09-28]
    paths: [.github/workflows/paper-ii-audit-build.yml]

permissions:
  contents: write

jobs:
  revision:
    if: github.repository == 'long-mathematics/exponential-integral-theorem' && github.ref == 'refs/heads/paper-ii/audit-clarifications-2026-09-28'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Preserve the audited baseline
        run: |
          mkdir -p .build/audit-baseline
          git archive 093e260aa41a1d71ea6f12b41a0a84ed9c6c1463 | tar -x -C .build/audit-baseline
          cp scripts/paper_ii_audit_revision_once.py .build/paper_ii_audit_revision_once.py
      - name: Apply exact checked manuscript revisions
        run: python3 scripts/paper_ii_audit_revision_once.py
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Run build-tool tests
        run: make test 2>&1 | tee .build/paper-ii-make-test.txt
      - name: Rebuild manuscripts
        run: make pdf 2>&1 | tee .build/paper-ii-make-pdf.txt
      - name: Preserve the seven unchanged PDF snapshots and manifest entries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = 'papers/02-compact-polynomial-line-kz/linear-kz-affine-line.tex'
          baseline = Path('.build/audit-baseline')
          manifest_path = Path('output/pdf/manifest.json')
          old = json.loads((baseline / manifest_path).read_text())
          new = json.loads(manifest_path.read_text())
          updated = next(row for row in new['documents'] if row['source'] == source)
          assert updated['source_sha256'] != next(row for row in old['documents'] if row['source'] == source)['source_sha256']
          for row in old['documents']:
              if row['source'] != source:
                  Path(row['pdf']).write_bytes((baseline / row['pdf']).read_bytes())
          old['documents'] = [updated if row['source'] == source else row for row in old['documents']]
          manifest_path.write_text(json.dumps(old, indent=2) + '\n')
          PY
      - name: Verify hashes, rebuilt PDF text, logs, and links
        run: make check 2>&1 | tee .build/paper-ii-make-check.txt
      - name: Record build verification and restrict the final changes
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          source = 'papers/02-compact-polynomial-line-kz/linear-kz-affine-line.tex'
          note_path = Path('notes/provenance/paper-ii-audit-clarifications-2026-09-28.md')
          manifest = json.loads(Path('output/pdf/manifest.json').read_text())
          record = next(row for row in manifest['documents'] if row['source'] == source)
          with note_path.open('a') as handle:
              handle.write('\n## Build verification\n\n')
              handle.write('`make test`, `make pdf`, and `make check` passed in the revision build.\n')
              handle.write(f'The revised Paper II PDF has {record["pages"]} pages. The other seven\n')
              handle.write('PDF snapshots and their manifest entries were restored byte-for-byte\nfrom the audited baseline before the final check.\n\n')
              handle.write('Visual review and the normal pull-request check are recorded separately\nin the pull request before merge. Compilation and regression checks do\nnot constitute a mathematical certification.\n')
          Path('scripts/paper_ii_audit_revision_once.py').unlink()
          allowed = {
              source,
              'output/pdf/linear-kz-affine-line.pdf',
              'output/pdf/manifest.json',
              str(note_path),
              'scripts/paper_ii_audit_revision_once.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed | untracked <= allowed, (changed | untracked) - allowed
          PY
          git diff --check
          git add papers/02-compact-polynomial-line-kz/linear-kz-affine-line.tex output/pdf/linear-kz-affine-line.pdf output/pdf/manifest.json notes/provenance/paper-ii-audit-clarifications-2026-09-28.md scripts/paper_ii_audit_revision_once.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Paper II: correct the auxiliary cover and clarify the audited proofs'
          git push origin HEAD:refs/heads/paper-ii/audit-clarifications-2026-09-28
      - name: Upload manuscript sources, snapshots, and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-ii-audit-package
          path: |
            papers/02-compact-polynomial-line-kz/linear-kz-affine-line.tex
            output/pdf/linear-kz-affine-line.pdf
            output/pdf/manifest.json
            notes/provenance/paper-ii-audit-clarifications-2026-09-28.md
            .build/audit-baseline/
            .build/paper-ii-*
            .build/paper_ii_audit_revision_once.py
            .build/**/*.log
            .build/**/build-console.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
