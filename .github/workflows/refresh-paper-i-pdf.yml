name: Refresh Paper I generated output

on:
  push:
    branches:
      - paper-i-trim-redundant-zero-bookkeeping

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[refresh output]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: paper-i-trim-redundant-zero-bookkeeping
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Rebuild committed PDFs and manifest
        run: make pdf
      - name: Render Paper I pages for inspection
        run: |
          mkdir -p .inspection
          pdftoppm -png -r 110 -f 4 -singlefile output/pdf/exponential-integral-theorem.pdf .inspection/paper-i-page-04
          pdftoppm -png -r 110 -f 8 -singlefile output/pdf/exponential-integral-theorem.pdf .inspection/paper-i-page-08
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pdf .inspection/paper-i-page-04.png .inspection/paper-i-page-08.png
          git commit -m "Refresh Paper I PDF and manifest [refresh output]"
          git push origin HEAD:paper-i-trim-redundant-zero-bookkeeping
