name: V-VI preparation
on:
  push:
    branches: [papers-v-vi-comparison-factorial]
    paths: [.github/workflows/papers-v-vi-preparation.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Export tracked source snapshot
        run: |
          git rev-parse HEAD > /tmp/revision.txt
          git archive --format=tar HEAD > /tmp/eit-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: eit-source-snapshot
          path: |
            /tmp/eit-source.tar
            /tmp/revision.txt
          retention-days: 7
