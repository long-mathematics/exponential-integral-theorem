name: Isolated papers I-III citation workspace

on:
  push:
    branches: [build/papers-i-iii-citations-20261005]
    paths: [.github/workflows/papers-i-iii-citation-work.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install repository TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Apply and verify the reviewed editorial patch
        run: |
          git apply --check _citation-edit.patch
          git apply _citation-edit.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess
          expected = {
            'papers/01-exponential-integral-theorem/exponential-integral-theorem.tex': '65567be47d72340210a99932fbcd989fd5e690ffa081b668d0a09c0dde3a902d',
            'papers/02-compact-polynomial-line-kz/linear-kz-affine-line.tex': '4568771bc1113ed443a77ceea9c89ce211f40a471a18b525aa1e4e38acb6e26b',
            'papers/03-complete-polynomial-kz/polynomial-kz-affine-line.tex': '4f1cb54e3b6aab6af1add1da97635b165fe1df9f91e86a79078e588717caaa76',
            'papers/03-complete-polynomial-kz/polynomial-kz-supplement.tex': '72b0d7585620608b23469edf809c664c03657779f348e73af71f32e10fc1b1d5',
          }
          Path('/tmp/eit-edited-sources.json').write_text(json.dumps(expected))
          for path, sha in expected.items():
            new = Path(path).read_text()
            assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == sha, path
            old = subprocess.check_output(['git', 'show', 'HEAD:' + path], text=True)
            for env in ['proof','theorem','lemma','proposition','corollary','definition','abstract']:
              pattern = rf'\\begin\{{{env}\}}.*?\\end\{{{env}\}}'
              assert re.findall(pattern, old, re.S) == re.findall(pattern, new, re.S), (path, env)
            for pattern in [r'\\label\{[^}]+\}', r'\\date\{[^}]+\}', r'^\\author.*$']:
              assert re.findall(pattern, old, re.M) == re.findall(pattern, new, re.M), (path, pattern)
            refs = re.findall(r'\\bibitem\{([^}]+)\}', new)
            cites = {key.strip() for group in re.findall(r'\\cite(?:\[[^]]*\])?\{([^}]+)\}', new) for key in group.split(',')}
            assert len(refs) == len(set(refs)) and set(refs) == cites, path
          Path('/tmp/eit-prior-manifest.json').write_bytes(Path('output/pdf/manifest.json').read_bytes())
          print('Reviewed source hashes, unchanged statements/proofs/labels, and citation keys verified.')
          PY
      - name: Test and build all manuscripts
        run: |
          make test
          make pdf
      - name: Preserve all unrelated snapshots and manifest records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          selected = set(json.loads(Path('/tmp/eit-edited-sources.json').read_text()))
          old = json.loads(Path('/tmp/eit-prior-manifest.json').read_text())
          new = json.loads(Path('output/pdf/manifest.json').read_text())
          for index, doc in enumerate(new['documents']):
            if doc['source'] not in selected:
              previous = next(item for item in old['documents'] if item['source'] == doc['source'])
              Path(doc['pdf']).write_bytes(subprocess.check_output(['git','show','HEAD:' + doc['pdf']]))
              new['documents'][index] = previous
          Path('output/pdf/manifest.json').write_text(json.dumps(new, indent=2) + '\n')
          allowed = selected | {'output/pdf/manifest.json'} | {item['pdf'] for item in new['documents'] if item['source'] in selected}
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == allowed, (changed, allowed)
          print('Only the four edited sources, their four PDFs, and manifest records changed.')
          PY
          make check
          git diff --check
      - name: Commit only the verified publication files to this temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/01-exponential-integral-theorem/exponential-integral-theorem.tex papers/02-compact-polynomial-line-kz/linear-kz-affine-line.tex papers/03-complete-polynomial-kz/polynomial-kz-affine-line.tex papers/03-complete-polynomial-kz/polynomial-kz-supplement.tex output/pdf/exponential-integral-theorem.pdf output/pdf/linear-kz-affine-line.pdf output/pdf/polynomial-kz-affine-line.pdf output/pdf/polynomial-kz-supplement.pdf output/pdf/manifest.json
          git commit -m 'docs: acknowledge prior work in papers I-III and rebuild matching PDFs'
          git push origin HEAD:build/papers-i-iii-citations-20261005
          git archive --format=zip -o "$RUNNER_TEMP/eit-citation-revision.zip" HEAD
          git rev-parse HEAD
          git ls-tree -r HEAD papers/01-exponential-integral-theorem papers/02-compact-polynomial-line-kz papers/03-complete-polynomial-kz output/pdf notes/provenance/papers-i-iii-prior-art-2026-10-05.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: eit-citation-revision
          path: |
            ${{ runner.temp }}/eit-citation-revision.zip
            .build/**/*.log
            .build/**/build-console.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
