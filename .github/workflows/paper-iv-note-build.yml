name: Paper IV standalone repair note

on:
  push:
    branches: [paper-iv/standalone-repair-note-2026-09-28]
    paths: [.github/workflows/paper-iv-note-build.yml]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  note:
    if: github.repository == 'long-mathematics/exponential-integral-theorem' && github.ref == 'refs/heads/paper-iv/standalone-repair-note-2026-09-28'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify and copy the frozen baseline
        run: |
          BASE=0bb151018dc73c9e48b847fff31fb82fd2cb9072
          test "$(git rev-parse origin/baseline/paper-iv-pre-repair-2026-09-28)" = "$BASE"
          mkdir -p .build/audit-baseline
          git archive "$BASE" | tar -x -C .build/audit-baseline
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          record = json.loads(Path('notes/repairs/paper-iv-baseline.json').read_text())
          for field in ('source', 'pdf'):
              assert hashlib.sha256(Path(record[field]).read_bytes()).hexdigest() == record[field + '_sha256']
          PY
          cp scripts/paper_iv_note_typeset_once.py .build/paper_iv_note_typeset_once.py
          python3 scripts/paper_iv_note_typeset_once.py
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Test the repository build checks
        run: make test 2>&1 | tee .build/paper-iv-note-make-test.txt
      - name: Build all nine documents
        run: make pdf 2>&1 | tee .build/paper-iv-note-make-pdf.txt
      - name: Restore all eight baseline PDF snapshots and manifest records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline = Path('.build/audit-baseline')
          mp = Path('output/pdf/manifest.json')
          old = json.loads((baseline / mp).read_text())
          new = json.loads(mp.read_text())
          old_by_source = {r['source']: r for r in old['documents']}
          assert len(old_by_source) == 8
          note_source = 'papers/04-relative-exponential-nori-ayoub/repairs/paper-iv-repair-note.tex'
          assert set(r['source'] for r in new['documents']) == set(old_by_source) | {note_source}
          for row in old['documents']:
              assert Path(row['source']).read_bytes() == (baseline / row['source']).read_bytes(), row['source']
              Path(row['pdf']).write_bytes((baseline / row['pdf']).read_bytes())
          new['documents'] = [old_by_source.get(row['source'], row) for row in new['documents']]
          mp.write_text(json.dumps(new, indent=2) + '\n')
          PY
      - name: Verify all nine committed snapshots, rebuilt text, and links
        run: make check 2>&1 | tee .build/paper-iv-note-make-check.txt
      - name: Record mechanical verification and commit only the standalone additions
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          baseline = Path('.build/audit-baseline')
          old = json.loads((baseline / 'output/pdf/manifest.json').read_text())
          new = json.loads(Path('output/pdf/manifest.json').read_text())
          new_by_source = {r['source']: r for r in new['documents']}
          for row in old['documents']:
              assert new_by_source[row['source']] == row
              for field in ('source', 'pdf'):
                  assert Path(row[field]).read_bytes() == (baseline / row[field]).read_bytes()
          note_source = 'papers/04-relative-exponential-nori-ayoub/repairs/paper-iv-repair-note.tex'
          text = Path(note_source).read_text()
          labels = re.findall(r'\\label\{([^}]+)\}', text)
          assert len(labels) == len(set(labels))
          report = {
              'baseline_commit': '0bb151018dc73c9e48b847fff31fb82fd2cb9072',
              'baseline_reference_verified': True,
              'all_eight_prior_sources_unchanged': True,
              'all_eight_prior_pdf_snapshots_unchanged': True,
              'all_eight_prior_manifest_records_unchanged': True,
              'make_test': 'passed', 'make_pdf': 'passed', 'make_check': 'passed',
              'new_document': new_by_source[note_source],
              'numbered_sections': len(re.findall(r'\\section\{', text)),
              'cross_reference_labels': len(labels),
              'theorem_lemma_proposition_corollary_environments': len(re.findall(r'\\begin\{(?:theorem|lemma|proposition|corollary)\}', text)),
              'external_input_environments': len(re.findall(r'\\begin\{externalinput\}', text)),
              'mathematical_status': 'replacement proofs drafted; fresh adversarial audit pending; not integrated',
              'visual_review': 'record separately after downloading and rendering the PDF'
          }
          Path('notes/repairs/paper-iv-note-build-verification.json').write_text(json.dumps(report, indent=2) + '\n')
          helper = 'scripts/paper_iv_note_typeset_once.py'
          Path(helper).unlink()
          allowed = {note_source, 'output/pdf/paper-iv-repair-note.pdf', 'output/pdf/manifest.json', 'notes/repairs/paper-iv-note-build-verification.json', helper}
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          assert changed | untracked <= allowed, (changed | untracked) - allowed
          PY
          git diff --check
          git add papers/04-relative-exponential-nori-ayoub/repairs/paper-iv-repair-note.tex output/pdf/paper-iv-repair-note.pdf output/pdf/manifest.json notes/repairs/paper-iv-note-build-verification.json scripts/paper_iv_note_typeset_once.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Build standalone Paper IV repair note; preserve every frozen manuscript snapshot'
          git push origin HEAD:refs/heads/paper-iv/standalone-repair-note-2026-09-28
      - name: Upload the standalone note and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-iv-standalone-repair-package
          path: |
            papers/04-relative-exponential-nori-ayoub/repairs/paper-iv-repair-note.tex
            output/pdf/paper-iv-repair-note.pdf
            output/pdf/manifest.json
            notes/repairs/
            .build/audit-baseline/
            .build/paper-iv-note-*.txt
            .build/paper_iv_note_typeset_once.py
            .build/paper-iv-repair-note/*.pdf
            .build/**/*.log
            .build/**/build-console.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
