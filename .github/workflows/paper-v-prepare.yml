name: Prepare Paper V integration

on:
  push:
    branches: [revision/paper-v-single-chain-2026-10-06]
    paths:
      - notes/candidates/2026-10-06-single-chain/successor/prepare-trigger.txt

permissions:
  contents: write

concurrency:
  group: paper-v-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/revision/paper-v-single-chain-2026-10-06'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: revision/paper-v-single-chain-2026-10-06
          fetch-depth: 0
      - name: Install existing build tools and exact-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils python3-sympy
      - name: Assemble the hash-guarded successor and canonical manuscript
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/revision/paper-v-single-chain-2026-10-06
          mkdir -p .build/paper-v-prepare
          /usr/bin/python3 notes/candidates/2026-10-06-single-chain/successor/build_successor.py --root . | tee .build/paper-v-prepare/successor.txt
          /usr/bin/python3 notes/candidates/2026-10-06-single-chain/successor/integrate_paper_v.py --root . | tee .build/paper-v-prepare/integration.txt
      - name: Run all exact regression tests
        shell: bash
        run: |
          set -euo pipefail
          PATH=/usr/bin:$PATH make test 2>&1 | tee .build/paper-v-prepare/make-test.txt
      - name: Rebuild managed PDFs and retain unrelated snapshots
        shell: bash
        run: |
          set -euo pipefail
          make pdf 2>&1 | tee .build/paper-v-prepare/make-pdf.txt
          /usr/bin/python3 notes/candidates/2026-10-06-single-chain/successor/integrate_paper_v.py --root . --retain-other-pdfs
      - name: Run full read-only snapshot validation
        shell: bash
        run: |
          set -euo pipefail
          make check 2>&1 | tee .build/paper-v-prepare/make-check.txt
      - name: Compile the standalone corrected successor
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1786665600'
          FORCE_SOURCE_DATE: '1'
          TZ: UTC
        run: |
          set -euo pipefail
          mkdir -p .build/paper-v-successor
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -latexoption=-no-shell-escape -outdir="$PWD/.build/paper-v-successor" notes/candidates/2026-10-06-single-chain/successor/generic-single-chain-theorem-v2.tex 2>&1 | tee .build/paper-v-prepare/successor-build.txt
          /usr/bin/python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build import check_log
          check_log(Path('.build/paper-v-successor/generic-single-chain-theorem-v2.log').read_text())
          PY
      - name: Record preservation and build evidence
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          BASE='d5ae8f9081c7bc34d1622316bd8463482f244395'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          folder=Path('notes/candidates/2026-10-06-single-chain/successor')
          manifest=json.loads((folder/'integration-manifest.json').read_text())
          preserved={}
          for name in manifest['other_canonical_sources']:
              before=subprocess.check_output(['git','show',BASE+':'+name])
              now=Path(name).read_bytes()
              if before != now: raise RuntimeError('Unexpected source change: '+name)
              preserved[name]=sha(now)
          baseline=json.loads(subprocess.check_output(['git','show',BASE+':output/pdf/manifest.json']))
          for rec in baseline['documents']:
              if rec['source']=='papers/05-polynomial-flags/polynomial-flag-exponential-periods.tex': continue
              if sha(Path(rec['pdf']).read_bytes()) != rec['pdf_sha256']: raise RuntimeError('Unrelated PDF changed')
          arc=Path('notes/archives/2026-10-06-paper-v-before-single-chain')
          for suffix,oldpath in [('tex','papers/05-polynomial-flags/polynomial-flag-exponential-periods.tex'),('pdf','output/pdf/polynomial-flag-exponential-periods.pdf')]:
              if (arc/('polynomial-flag-exponential-periods.'+suffix)).read_bytes()!=subprocess.check_output(['git','show',BASE+':'+oldpath]): raise RuntimeError('Archive differs: '+suffix)
          data={'base_commit':BASE,'preparation_input_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'commands_passed':['make test','make pdf','make check','standalone successor latexmk and log validation'],'other_canonical_sources_preserved':preserved,'unrelated_pdf_snapshots_preserved':True,'previous_paper_v_archived_verbatim':True,'documents':json.loads(Path('output/pdf/manifest.json').read_text())['documents'],'note':'Finite computations and successful builds are not peer review or formal verification. Final PR CI and integrated visual/proof review remain required.'}
          Path('notes/provenance/paper-v-single-chain-build-2026-10-06.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Remove preparation workflow and commit only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = revision/paper-v-single-chain-2026-10-06
          rm .github/workflows/paper-v-prepare.yml
          git add README.md notes/repository-status.md .github/workflows/latex.yml
          git add -u .github/workflows/paper-v-prepare.yml
          git add papers/05-polynomial-flags/polynomial-flag-exponential-periods.tex
          git add notes/candidates/2026-10-06-single-chain/successor notes/provenance/paper-v-single-chain-build-2026-10-06.json
          git add notes/archives/2026-10-06-paper-v-before-single-chain/polynomial-flag-exponential-periods.tex
          git add -f notes/archives/2026-10-06-paper-v-before-single-chain/polynomial-flag-exponential-periods.pdf
          git add output/pdf/polynomial-flag-exponential-periods.pdf output/pdf/manifest.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate checked single-chain Paper V, archive previous manuscript, and refresh its PDF'
          git push origin HEAD:refs/heads/revision/paper-v-single-chain-2026-10-06
      - name: Create credential-free review source archive
        if: always()
        run: |
          mkdir -p .build/paper-v-prepare
          git rev-parse HEAD > .build/paper-v-prepare/review-head.txt
          git status --short > .build/paper-v-prepare/worktree-status.txt
          git archive --format=tar.gz --output=.build/paper-v-review-source.tar.gz HEAD
      - name: Upload review source and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paper-v-integration-review
          path: |
            .build/paper-v-review-source.tar.gz
            .build/paper-v-prepare/
            .build/paper-v-successor/*.pdf
            .build/paper-v-successor/*.log
            .build/**/build-console.txt
            .build/**/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
